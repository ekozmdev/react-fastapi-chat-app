[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.3",
    "fastapi>=0.116.0",
    "openai>=1.93.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg>=3.2.9",
    "psycopg-binary>=3.2.9",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.2",
]

# ruffの設定
# defaultの設定は以下を参照
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# チェック・修正するルール
# ルールの詳細は以下を参照
# https://docs.astral.sh/ruff/rules/
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "C90",  # mccabe
    "I",    # isort (ruff check --fixでisortに相当するformatが実行される)
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
# 除外するエラー
ignore = [
    "E501", # line-too-long: フォーマッタで調整できない場合は無視する(settingsやURLなど)
    "S101", # assert; テストで使うので無視する
]
# 修正しないエラー
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.format]
# フォーマッターの設定はdefaultを使用
